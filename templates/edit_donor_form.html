<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h2>Edit Donor Information (ID: {{ donor.donor_id }})</h2>

    <form action="{{ url_for('edit_donor_form', donor_id=donor.donor_id) }}" method="POST">
        <label>First Name:</label>
        <input type="text" name="first" value="{{ donor.first }}" required><br><br>

        <label>Last Name:</label>
        <input type="text" name="last" value="{{ donor.last }}" required><br><br>

        <label>Country:</label>
        <input type="text" name="country" value="{{ donor.country }}" required><br><br>

        <label>Phone Number:</label>
        <input type="text" name="phone_number" value="{{ donor.phone_number }}" required><br><br>

        <label>Blood Type:</label>
        <select name="blood_type" required>
            <option value="">Select Blood Type</option>
            <option value="A+" {% if donor.blood_type == 'A+' %}selected{% endif %}>A+</option>
            <option value="A-" {% if donor.blood_type == 'A-' %}selected{% endif %}>A-</option>
            <option value="B+" {% if donor.blood_type == 'B+' %}selected{% endif %}>B+</option>
            <option value="B-" {% if donor.blood_type == 'B-' %}selected{% endif %}>B-</option>
            <option value="O+" {% if donor.blood_type == 'O+' %}selected{% endif %}>O+</option>
            <option value="O-" {% if donor.blood_type == 'O-' %}selected{% endif %}>O-</option>
            <option value="AB+" {% if donor.blood_type == 'AB+' %}selected{% endif %}>AB+</option>
            <option value="AB-" {% if donor.blood_type == 'AB-' %}selected{% endif %}>AB-</option>
        </select><br><br>

        <button type="submit">Update Donor</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">
        <button>Back to Donors</button>
    </a>
</body>
</html>
